    <link rel="preload" href="%BASE_URL%fonts/JetBrainsMono-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // GitHub Pages SPA shim — read the redirected path written by 404.html and rewrite history.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
